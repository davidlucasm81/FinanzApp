plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.google.services)
    alias(libs.plugins.firebase.crashlytics)
    alias(libs.plugins.firebase.perf)
}
// Carga de las credenciales de firma desde un fichero fuera del repo.
// keystore.properties NUNCA se sube a git (ver .gitignore); en su lugar se
// versiona keystore.properties.example con la estructura sin valores reales.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasKeystoreProperties = keystorePropertiesFile.exists()
if (hasKeystoreProperties) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Carga de las claves de AdMob y RevenueCat desde local.properties (ignorado por Git)
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

android {
    namespace 'com.finanzapp.app'
    compileSdk 37

    defaultConfig {
        applicationId "com.finanzapp.app"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Inyectamos el App ID en el Manifest
        manifestPlaceholders = [
                ADMOB_APP_ID: localProperties.getProperty('admob.app.id', 'ca-app-pub-3940256099942544~3347511713')
        ]

        // Definimos las claves para que estén disponibles en el código Java
        buildConfigField "String", "ADMOB_BANNER_FIXED_ID", "\"${localProperties.getProperty('admob.banner.fixed.id', 'ca-app-pub-3940256099942544/6300978111')}\""
        buildConfigField "String", "ADMOB_BANNER_INTERCALATED_ID", "\"${localProperties.getProperty('admob.banner.intercalated.id', 'ca-app-pub-3940256099942544/6300978111')}\""
        buildConfigField "String", "REVENUECAT_API_KEY", "\"${localProperties.getProperty('revenuecat.api.key', 'goog_placeholder_api_key')}\""
        buildConfigField "String", "GOOGLE_PLAY_PUBLIC_KEY", "\"${localProperties.getProperty('google.play.public.key', 'CONSTRUCT_YOUR_KEY_HERE')}\""
    }

    signingConfigs {
        release {
            if (hasKeystoreProperties) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // Sin keystore.properties (p. ej. en CI de un fork, o en un
            // checkout limpio sin el fichero local) el build de release
            // sigue configurando el bloque para no romper la sincronización,
            // pero fallará al firmar/empaquetar hasta que exista el fichero;
            // es el comportamiento deseado: nunca firmar con una config vacía.
            if (hasKeystoreProperties) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    packagingOptions {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
            excludes += "META-INF/DEPENDENCIES"
            excludes += "META-INF/LICENSE*"
            excludes += "META-INF/NOTICE*"
        }
    }
}

dependencies {
    coreLibraryDesugaring libs.desugar.jdk.libs
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.auth
    implementation libs.firebase.firestore
    implementation libs.firebase.crashlytics
    implementation libs.firebase.perf
    implementation libs.androidx.credentials
    implementation libs.androidx.credentials.play.services.auth
    implementation libs.googleid
    implementation libs.androidx.navigation.fragment
    implementation libs.androidx.navigation.ui
    implementation libs.androidx.lifecycle.livedata
    implementation libs.androidx.core.splashscreen
    implementation libs.colorpicker
    implementation libs.mpandroidchart
    implementation libs.poi.ooxml
    implementation libs.admob
    implementation libs.purchases
    implementation libs.ump

    implementation libs.glide
    annotationProcessor libs.compiler

    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}